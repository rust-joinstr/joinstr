[package]
name = "joinstr_flutter"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge wrapper around the joinstr crate"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The joinstr crate lives in the same repo. `default-features = false` keeps the
# blocking (non-`async`) interface that `src/interface.rs` exposes.
joinstr = { path = "../../rust/joinstr" }
flutter_rust_bridge = "=2.12.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Detach this crate from the parent `joinstr` cargo workspace: it is a separate,
# self-contained artifact compiled by cargokit, not a workspace member.
[workspace]
