name: joinstr_flutter
description: "Dart/Flutter bindings for the joinstr coinjoin library (rust-joinstr/joinstr)."
version: 0.1.0
homepage: https://github.com/rust-joinstr/joinstr
publish_to: none

environment:
  sdk: ">=3.2.3 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  ffi: ^2.1.4
  meta: ^1.15.0

dev_dependencies:
  ffigen: ^18.1.0
  build_runner: ^2.4.15
  lints: ^5.1.1
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
