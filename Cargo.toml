[workspace]
resolver = "2"

members = [
    "rust/joinstr",
    "rust/simple_nostr_client",
    "rust/simple_electrum_client",
    "rust/joinstr_wallet", "rust/backoff",
    "rust/socks5",
]

[workspace.dependencies]
base64ct = "=1.6.0"
url = "=2.5.2"
bip39 = "2.0.0"
bitcoin = "=0.32.2"
bitcoin_slices = "0.8.0"
dirs = "6.0.0"
hex-conservative = "0.2.1"
hex_lit = "0.1.1"
home = "=0.5.9"
joinstr = { path = "rust/joinstr" }
socks5 = { path = "rust/socks5" }
backoff = { path = "rust/backoff" }
libc = "0.2.170"
log = "0.4.20"
miniscript = "12.2.0"
nostr = "0.35.0"
nostr-sdk = "0.35.0"
nostrd = { git = "https://github.com/pythcoiner/nostrd.git", branch = "master" }
rand = "0.9.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = "1.0.218"
serde_json = "1.0.128"
simple_electrum_client = { path = "rust/simple_electrum_client" }
simple_nostr_client = { path = "rust/simple_nostr_client" }
tokio = "1.40.0"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
zeroize = "1"

[patch."https://github.com/pythcoiner/joinstr"]
base64ct = "=1.6.0"
