name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must match `flutter_rust_bridge` in dart/rust/Cargo.toml and dart/pubspec.yaml.
  # A mismatched codegen binary produces a spurious diff in the bindings check.
  FRB_VERSION: 2.12.0

# Every job here only reads the repo and runs checks. Nothing pushes, comments,
# or publishes, so the default read/write GITHUB_TOKEN is more than any step needs.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          # No step needs the token afterwards; leaving it in .git/config only
          # widens the blast radius if a later step is compromised.
          persist-credentials: false
      # Pinned so a new clippy release cannot turn CI red on an unrelated PR.
      # Bump deliberately, and fix the new lints in that same commit.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The dart bindings steps below build a separate workspace with its
          # own target dir, which the default `workspaces: .` never caches.
          workspaces: |
            .
            dart/rust
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # dart/rust sets its own `[workspace]`, so it is invisible to the
      # --workspace commands above and needs its own invocation.
      - name: rustfmt (dart bindings)
        working-directory: dart/rust
        run: cargo fmt -- --check
      - name: clippy (dart bindings)
        working-directory: dart/rust
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          # No step needs the token afterwards; leaving it in .git/config only
          # widens the blast radius if a later step is compromised.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: tests
        run: cargo test --workspace --lib
      - name: doctests
        run: cargo test --workspace --doc

  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          # No step needs the token afterwards; leaving it in .git/config only
          # widens the blast radius if a later step is compromised.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release

  bindings:
    # The flutter_rust_bridge output under dart/lib/src/generated and
    # dart/rust/src/frb_generated.rs is committed. Regenerate it and fail if it
    # differs, so a change to dart/rust/src/api can never land with stale
    # bindings (which breaks the build only once someone runs codegen).
    #
    # dart/rust's tests run here rather than in the `test` job because its
    # dependency tree (icu_* via idna_adapter) requires rustc >= 1.86, so it
    # cannot build on the older toolchain that job pins.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          # No step needs the token afterwards; leaving it in .git/config only
          # widens the blast radius if a later step is compromised.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          # codegen shells out to rustfmt for frb_generated.rs and silently
          # emits unformatted output if it is absent, which the staleness
          # check below would then report as a spurious diff.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # dart/rust is its own workspace with its own target dir; without this
          # its FRB/icu/openssl tree is cold-built on every run.
          workspaces: |
            .
            dart/rust
      # Pinned for the same reason clippy is: codegen shells out to `dart format`
      # and the staleness check compares those bytes, so a stable release that
      # changes formatting or analyzer lints would turn CI red on an unrelated
      # PR. Bump deliberately.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Cache codegen binary
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}
      - name: Install codegen
        if: steps.cache-frb.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked

      - name: flutter pub get
        working-directory: dart
        run: flutter pub get
      - name: Regenerate bindings
        working-directory: dart
        run: flutter_rust_bridge_codegen generate
      - name: Fail if committed bindings are stale
        run: |
          set -euo pipefail
          paths='dart/lib/src/generated dart/rust/src/frb_generated.rs dart/ios/Classes/frb_generated.h'
          # `git diff` is blind to untracked files. Codegen emits one dart file
          # per api module, so a new module whose generated file was never
          # `git add`ed would regenerate here, leave the diff empty, and let a
          # tree that no consumer can build pass as green. `git status` sees it.
          changes=$(git status --porcelain -- $paths)
          if [ -n "$changes" ]; then
            echo "::error::Committed flutter_rust_bridge output is stale or incomplete."
            echo "Run 'cd dart && flutter_rust_bridge_codegen generate' and commit the result."
            echo "$changes"
            git diff -- $paths
            exit 1
          fi

      # Covers the FFI boundary: scan-range bounds, pool decoding, mnemonic
      # handling. Runs after the staleness check so a stale-bindings failure is
      # not masked by a compile error.
      - name: tests (dart bindings)
        working-directory: dart/rust
        run: cargo test

      - name: flutter analyze
        working-directory: dart
        run: flutter analyze
      - name: flutter analyze (example)
        working-directory: dart/example
        run: flutter pub get && flutter analyze

  android-example:
    # The plugin declares `android: {ffiPlugin: true}`, so a consuming app runs
    # the vendored cargokit Gradle task. Nothing else here exercises it: a break
    # would surface first in a downstream app's build, not ours.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dart/rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: build apk
        working-directory: dart/example
        run: flutter build apk --debug --target-platform android-arm64
      # A successful build proves the crate compiles for the target; it does not
      # prove the four flutter_rust_bridge wire symbols survived linking into the
      # packaged .so, which is what Dart looks up at runtime. Assert them so a
      # linking regression fails here instead of in a consumer's app.
      - name: verify FFI symbols are exported (Android)
        working-directory: dart/example
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -o -j "$apk" 'lib/arm64-v8a/libjoinstr_flutter.so' -d "$RUNNER_TEMP/so"
          so="$RUNNER_TEMP/so/libjoinstr_flutter.so"
          for sym in list_coins list_pools initiate_coinjoin join_coinjoin; do
            nm -D "$so" | grep -q "frbgen_joinstr_flutter_wire__crate__api__joinstr__$sym" \
              || { echo "::error::missing exported symbol for $sym"; exit 1; }
          done
          echo "all four FFI entry points exported"

  ios-example:
    # The plugin declares `ios: {ffiPlugin: true}`, so a consuming iOS app runs
    # dart/ios/joinstr_flutter.podspec's script_phase into cargokit's
    # build_pod.sh. That path was never built before, so an iOS consumer would
    # have discovered its breakage on our behalf.
    #
    # Two phases. First a device build (--no-codesign, the real ship target) and
    # a symbol-export check, mirroring android-example. Then a simulator build
    # and an on-device runtime smoke test that actually calls across the FFI, so
    # a break in loading or marshalling fails here rather than in a consumer app.
    # The runtime phase builds for the simulator so the Rust static lib is the
    # same arch the test launches on, and reuses that build.
    runs-on: macos-latest
    # A wedged xcodebuild/simulator otherwise runs to the 360-minute default, and
    # macOS minutes bill at 10x. Cap it so a hang fails fast.
    timeout-minutes: 30
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dart/rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: build ios (device)
        working-directory: dart/example
        run: flutter build ios --debug --no-codesign
      # Xcode's nm can't read rustc 1.96's LLVM 22 objects, so use llvm-nm.
      - name: verify FFI symbols are exported (iOS)
        working-directory: dart/example
        run: |
          set -euo pipefail
          # `|| true`: under pipefail, find returns non-zero if a search path is
          # absent, and head closing the pipe early raises SIGPIPE (141); either
          # would abort the assignment before the test -n check below.
          lib=$(find build "$HOME/Library/Developer/Xcode/DerivedData" \
            -name libjoinstr_flutter.a 2>/dev/null | head -1 || true)
          test -n "$lib" || { echo "::error::libjoinstr_flutter.a not found"; exit 1; }
          rustup component add llvm-tools-preview
          host=$(rustc -vV | awk '/^host:/{print $2}')
          llvm_nm="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-nm"
          test -x "$llvm_nm" || { echo "::error::llvm-nm not found at $llvm_nm"; exit 1; }
          "$llvm_nm" "$lib" > "$RUNNER_TEMP/ios-syms.txt" 2>/dev/null || true
          for sym in list_coins list_pools initiate_coinjoin join_coinjoin; do
            grep -q "frbgen_joinstr_flutter_wire__crate__api__joinstr__$sym" "$RUNNER_TEMP/ios-syms.txt" \
              || { echo "::error::missing exported symbol for $sym"; exit 1; }
          done
          echo "all four FFI entry points exported"
      # Simulator build for the runtime smoke test. Building it here (rather than
      # letting `flutter test` build implicitly) keeps the Rust static lib on the
      # simulator arch and lets the test reuse the artifact.
      - name: build ios (simulator)
        working-directory: dart/example
        run: flutter build ios --debug --simulator
      # Prove the boundary is not just linked but callable: init the runtime and
      # round-trip a few offline calls on a booted simulator.
      #
      # continue-on-error: the gating iOS checks are the device build and the FFI
      # symbol-export verification above (the same bar android-example gates on).
      # This runtime step is an extra signal: `flutter test -d <sim>` intermittently
      # hangs at app launch / VM-service connect on headless CI runners, which is a
      # harness flake unrelated to our code, so it must not red an otherwise-green
      # main. The perl alarm still bounds a hang to ~7 minutes with logs.
      - name: run FFI smoke tests (iOS simulator)
        working-directory: dart/example
        continue-on-error: true
        run: |
          set -euo pipefail
          dev=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$dev" || { echo "::error::no available iPhone simulator"; exit 1; }
          xcrun simctl boot "$dev" 2>/dev/null || true
          xcrun simctl bootstatus "$dev" || true
          perl -e 'alarm 420; exec @ARGV or die "exec: $!"' \
            flutter test integration_test/ffi_smoke_test.dart -d "$dev"
